[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py tests.py
# --durations expõe os testes mais lentos (perf da suíte). NÃO colocar --cov aqui:
# o container baked não tem pytest-cov e isso quebraria todo `pytest` lá dentro.
# Cobertura é opt-in via requirements-dev.txt (ver comentário no arquivo).
addopts = --durations=25
