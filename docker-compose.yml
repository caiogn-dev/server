# ─────────────────────────────────────────────────────────────────────────────
# Log rotation — sem isto o driver json-file cresce sem limite e enche o disco.
# 50m x 5 = no máx 250MB de log por container. Aplicado em todos os serviços.
# ─────────────────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# ─────────────────────────────────────────────────────────────────────────────
# Common Django environment — shared by web, celery, celery-beat
# ─────────────────────────────────────────────────────────────────────────────
x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  # Core
  SECRET_KEY: ${SECRET_KEY}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend.pastita.com.br}
  DEBUG: "False"
  # Error monitoring (GlitchTip self-hosted, compatível com sentry-sdk).
  # Ativa só se SENTRY_DSN estiver no .env. GlitchTip alcançável via pastita_network.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  # Database / Cache
  DATABASE_URL: ${DATABASE_URL}
  # App conecta via pgbouncer (transaction pooling). CONN_MAX_AGE=0: Django devolve
  # a conexão ao pgbouncer a cada request; o pooler multiplexa e limita o Postgres
  # ao default_pool_size. Evita o vazamento de conexões idle do contexto ASGI.
  DB_CONN_MAX_AGE: "0"
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  # CORS / CSRF
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  # URLs
  BASE_URL: ${BASE_URL}
  BACKEND_URL: ${BACKEND_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  DASHBOARD_URL: ${DASHBOARD_URL}
  # WhatsApp
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v18.0}
  # Embedded Signup (OAuth code->token): App ID público + secret do app Meta.
  META_APP_ID: ${META_APP_ID}
  META_APP_SECRET: ${META_APP_SECRET}
  DEFAULT_WHATSAPP_ACCOUNT_ID: ${DEFAULT_WHATSAPP_ACCOUNT_ID}
  DEFAULT_WHATSAPP_ACCOUNT_ACCESS_TOKEN: ${DEFAULT_WHATSAPP_ACCOUNT_ACCESS_TOKEN}
  DEFAULT_WHATSAPP_ACCOUNT_PHONE_NUMBER_ID: ${DEFAULT_WHATSAPP_ACCOUNT_PHONE_NUMBER_ID}
  DEFAULT_WHATSAPP_ACCOUNT_WABA_ID: ${DEFAULT_WHATSAPP_ACCOUNT_WABA_ID}
  DEFAULT_WHATSAPP_ACCOUNT_OWNER_EMAIL: ${DEFAULT_WHATSAPP_ACCOUNT_OWNER_EMAIL}
  DEFAULT_STORE_SLUG: ${DEFAULT_STORE_SLUG}
  # Instagram
  INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
  INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
  INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}
  # AI / LLM
  KIMI_API_KEY: ${KIMI_API_KEY}
  KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding/}
  KIMI_MODEL_NAME: ${KIMI_MODEL_NAME:-kimi-coder}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY}
  NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
  NVIDIA_MODEL_NAME: ${NVIDIA_MODEL_NAME:-meta/llama-3.1-70b-instruct}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
  LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm-proxy:4000}
  LITELLM_PROXY_KEY: ${LITELLM_PROXY_KEY}
  # Payments
  MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
  MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY}
  MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET}
  MERCADO_PAGO_SANDBOX_TOKEN: ${MERCADO_PAGO_SANDBOX_TOKEN:-}
  MERCADO_PAGO_RECIPIENT_NAME: ${MERCADO_PAGO_RECIPIENT_NAME:-}
  # Billing — kill-switches (default OFF; ligar só no go-live)
  BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-false}
  BILLING_SETUP_FEE_ENABLED: ${BILLING_SETUP_FEE_ENABLED:-false}
  BILLING_AUTOCHARGE_ENABLED: ${BILLING_AUTOCHARGE_ENABLED:-false}
  # Faltava repassar: a flag estava true no .env e o container nunca a via,
  # então settings.BILLING_PIX_ENABLED caía no default false e a geração de
  # fatura PIX nunca rodava. Era este o "go-live de cobrança pausado".
  BILLING_PIX_ENABLED: ${BILLING_PIX_ENABLED:-false}
  # Lojas do próprio dono, únicas autorizadas a receber na conta da plataforma.
  PLATFORM_GATEWAY_STORE_SLUGS: ${PLATFORM_GATEWAY_STORE_SLUGS:-}
  COEX_ALERT_EMAILS: ${COEX_ALERT_EMAILS:-}
  # Email
  RESEND_API_KEY: ${RESEND_API_KEY}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  # Maps
  GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
  GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY}
  # Web Push (VAPID)
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-admin@pastita.com.br}
  # Toca Delivery
  TOCA_DELIVERY_API_URL: ${TOCA_DELIVERY_API_URL:-https://api.tocadelivery.com.br}
  TOCA_DELIVERY_EMAIL: ${TOCA_DELIVERY_EMAIL}
  TOCA_DELIVERY_PASSWORD: ${TOCA_DELIVERY_PASSWORD}
  TOCA_DELIVERY_ENABLED: ${TOCA_DELIVERY_ENABLED:-false}
  # Meta / Pixel (IDs and credentials are configured per store)
  META_CAPI_VERSION: ${META_CAPI_VERSION:-v25.0}
  # Storage
  USE_S3: ${USE_S3:-false}
  SERVE_MEDIA_FILES: ${SERVE_MEDIA_FILES:-true}
  MEDIA_URL: ${MEDIA_URL:-/media/}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-sa-east-1}
  # Postado admin
  POSTADO_ADMIN_TOKEN: ${POSTADO_ADMIN_TOKEN:-}
  # Uber Delivery
  UBER_API_KEY: ${UBER_API_KEY}
  UBER_CLIENT_SECRET: ${UBER_CLIENT_SECRET}
  UBER_API_BASE_URL: ${UBER_API_BASE_URL}
  UBER_CUSTOMER_ID: ${UBER_CUSTOMER_ID}

services:
  db:
    image: postgres:15-alpine
    container_name: pastita_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: pastita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    # max_connections=200 evita "too many clients" com múltiplos workers ASGI + Celery
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bind só em loopback — Postgres NÃO deve ser alcançável pela internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # IP fixo: o pgbouncer aponta p/ 172.20.0.2 via extra_hosts (c-ares não
    # resolve DNS Docker). Sem isto, se o db pegar outro IP no recreate, o
    # pooler perde o banco = outage. Subnet pastita_network = 172.20.0.0/16.
    networks:
      default:
        ipv4_address: 172.20.0.2

  redis:
    image: redis:7-alpine
    container_name: pastita_redis
    restart: unless-stopped
    logging: *default-logging
    entrypoint: >
      sh -c "ln -sf /bin/ls /usr/bin/ls 2>/dev/null || true &&
             redis-server --appendonly yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: pastita_pgbouncer
    restart: unless-stopped
    logging: *default-logging
    environment:
      # c-ares (resolver do pgbouncer 1.15) não resolve o alias 'db' no DNS do Docker;
      # usar o nome canônico do container resolve o "server DNS lookup failed".
      DATABASES_HOST: pastita_db
      DATABASES_PORT: 5432
      DATABASES_USER: postgres
      DATABASES_PASSWORD: ${DB_PASSWORD:-postgres123}
      DATABASES_DBNAME: pastita
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
    depends_on:
      db:
        condition: service_healthy
    # c-ares do pgbouncer não resolve nomes via DNS do Docker (search '.'/ndots:0);
    # /etc/hosts é lido antes do DNS, então mapeamos o container do db aqui.
    extra_hosts:
      - "pastita_db:172.20.0.2"
    ports:
      # Bind só em loopback — pgbouncer NÃO deve ser alcançável pela internet.
      - "127.0.0.1:6432:6432"
    # imagem do pgbouncer não tem psql; checa a porta com nc
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: pastita_backend:latest
    container_name: pastita_web
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *django-env
      # Só o web roda migrate/collectstatic/seed no boot (gate anti-race).
      RUN_INIT_TASKS: "1"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - backups:/app/backups
      - ${PWD}/../ftp-data/kerokero/generated:/seed/kero-kero:ro
      - ${PWD}/../ftp-data/cardapio-cesaladas/ce-saladas:/seed/ce-saladas:ro
      - ${PWD}/../ftp-data/cardapio-cesaladas/pastita:/seed/pastita:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 --timeout 120
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/sse/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    image: pastita_backend:latest
    container_name: pastita_celery
    restart: unless-stopped
    # tini como PID 1 faz reap dos processos órfãos que o healthcheck
    # (celery inspect ping | grep) deixa como zumbis — o worker celery
    # não reapa filhos reparentados. Sem isso vaza entradas na tabela de PIDs.
    init: true
    logging: *default-logging
    environment:
      <<: *django-env
      # A imagem pode carregar RUN_INIT_TASKS=1 no config (docker commit do
      # web); init (migrate/collectstatic) roda SÓ no web — força 0 aqui.
      RUN_INIT_TASKS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery worker -l info -Q celery,whatsapp,orders,payments,agents,automation,campaigns,default --concurrency=2
    volumes:
      - media_files:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --destination celery@$$HOSTNAME 2>/dev/null | grep -q OK || exit 1"]
      # 'inspect ping' faz boot completo do Django (~10s cold) — o timeout de 10s
      # estourava sob carga/swap e marcava unhealthy. Menos frequente + timeout
      # folgado torna o check confiável sem martelar a CPU a cada 30s.
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  celery-beat:
    image: pastita_backend:latest
    container_name: pastita_celery_beat
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *django-env
      RUN_INIT_TASKS: "0"
    depends_on:
      celery:
        condition: service_healthy
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile /tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Flower — dashboard de monitoramento do Celery (filas, workers, backlog, tasks).
  # Bind só em 127.0.0.1 (acesso via túnel/SSH); protegido por basic auth.
  # Usa a mesma imagem baked; requer 'flower' no requirements.txt (rebuild).
  flower:
    image: pastita_backend:latest
    container_name: pastita_flower
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *django-env
      RUN_INIT_TASKS: "0"
    command: celery -A config.celery flower --port=5555 --url_prefix=flower --basic_auth=${FLOWER_BASIC_AUTH:-admin:pastita123}
    ports:
      - "127.0.0.1:5556:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5555/flower/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: pastita_nginx
    restart: unless-stopped
    logging: *default-logging
    entrypoint: >
      sh -c "ln -sf /bin/ls /usr/bin/ls 2>/dev/null || true &&
             nginx -g 'daemon off;'"
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/api/sse/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pastita_cloudflared
    profiles:
      - internal-tunnel
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --url http://nginx:80
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  backups:

networks:
  default:
    name: pastita_network
    external: true
