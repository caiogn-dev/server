user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging que respeita o IP real vindo do Cloudflared
    log_format main '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffers ajustados para evitar erros de upload/requests grandes
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 50M;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/s;

    map $http_origin $cors_origin {
        default                              "";
        "https://cesaladas.com.br"           "https://cesaladas.com.br";
        "https://www.cesaladas.com.br"       "https://www.cesaladas.com.br";
        "https://cardapidex.com.br"          "https://cardapidex.com.br";
        "https://www.cardapidex.com.br"      "https://www.cardapidex.com.br";
        "https://painel.pastita.com.br"      "https://painel.pastita.com.br";
        "https://painel.cardapidex.com.br"   "https://painel.cardapidex.com.br";
        "https://pastita.com.br"             "https://pastita.com.br";
        "https://www.pastita.com.br"         "https://www.pastita.com.br";
        "https://backend.pastita.com.br"     "https://backend.pastita.com.br";
    }

    # Honra o X-Forwarded-Proto que o cloudflared manda (o TLS termina no
    # Cloudflare; cloudflared fala http com o nginx). Sem isto, $scheme=http e o
    # Django via a conexão como insegura (request.is_secure()=False) — quebrava
    # cookies seguros e URLs absolutas http:// (mixed-content nas fotos).
    map $http_x_forwarded_proto $cdx_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream django_app {
        server pastita_web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        charset utf-8;

        # DNS embutido do Docker (127.0.0.11) p/ re-resolver o upstream a cada 10s.
        # Sem isso o nginx cacheia o IP do pastita_web no boot; a cada deploy
        # (docker compose up -d --build recria o web com novo IP) o nginx ficava
        # apontando pro IP velho → 502 até reiniciar o nginx na mão.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Headers de segurança obrigatórios
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location /media/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Vary "Origin" always;
        }

        location /ws/ {
            # Variável força o nginx a re-resolver via resolver (vs upstream estático).
            set $ws_upstream pastita_web:8000;
            proxy_pass http://$ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $cdx_forwarded_proto;
            proxy_read_timeout 86400;
        }

        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, X-CSRFToken, x-csrftoken, X-Cart-Key, x-cart-key" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }

            if ($request_uri ~* "/webhooks/") {
                set $limit_zone "webhook";
            }

            set $app_upstream pastita_web:8000;
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $cdx_forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }

        location /health/ {
            access_log off;
            return 200 'OK';
        }
    }
}
